name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd mobile/ios
          pod install || true

      - name: Build iOS (No Codesign)
        run: |
          cd mobile
          flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          cd mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r FantaEventi.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FantaEventi-iOS-IPA
          path: mobile/build/ios/iphoneos/FantaEventi.ipa

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "FantaEventi iOS Release (v1.0.0)"
          body: "File IPA per installazione diretta su iPhone tramite Sideloadly / AltStore."
          files: mobile/build/ios/iphoneos/FantaEventi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
