name: Build Releases (APK & IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - refactor/mvvm

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android APK
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          cd mobile
          DEFINE_ARGS=""
          if [ -n "$MONGODB_URI" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=MONGODB_URI=$MONGODB_URI"; fi
          if [ -n "$BREVO_API_KEY" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=BREVO_API_KEY=$BREVO_API_KEY"; fi
          flutter build apk --release $DEFINE_ARGS

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install Flutter Dependencies
        run: |
          mkdir -p mobile/build/ios/SourcePackages
          cd mobile
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd mobile/ios
          pod install || true

      - name: Build iOS (No Codesign)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          cd mobile
          DEFINE_ARGS=""
          if [ -n "$MONGODB_URI" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=MONGODB_URI=$MONGODB_URI"; fi
          if [ -n "$BREVO_API_KEY" ]; then DEFINE_ARGS="$DEFINE_ARGS --dart-define=BREVO_API_KEY=$BREVO_API_KEY"; fi
          flutter build ios --release --no-codesign $DEFINE_ARGS

      - name: Create IPA Package
        run: |
          cd mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r FantaEventi.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/build/ios/iphoneos/FantaEventi.ipa

  publish-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Publish GitHub Release (APK & IPA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FantaEventi Release v1.0.0 (APK & IPA)"
          body: |
            ## 🚀 FantaEventi Release v1.0.0 (Notifiche Push & Guide Contestuali)
            Nuova versione con supporto completo per notifiche push di sistema e guide contestuali interattive!

            ### ✨ Novità principali:
            - 🔔 **Notifiche Push a Tendina (FCM v1)**: Ricezione notifiche in tempo reale anche con app chiusa/terminata, con suono e vibrazione.
            - 🎯 **Routing Intelligente**: Toccando la notifica atterri direttamente nella schermata corretta (o subito dopo il login se disconnesso).
            - ℹ️ **Pannelli Informativi Contestuali**: Dettagli completi in ogni schermata (Crea Evento, Dettaglio Evento con Quorum dinamico e storico bonus/malus con storno per organizzatore, Proposta Bonus, Profilo Giocatore e Richiesta VAR).
            - 🛡️ **Miglioramenti Creazione Evento**: Organizzatore protetto dalla rimozione e penalità VAR di default a -10pt evidenziata.

            ### 📥 Download Diretti:
            - 🤖 **Android**: Scarica e installa `app-release.apk` direttamente sul tuo smartphone.
            - 🍏 **iOS (iPhone)**: Scarica `FantaEventi.ipa` e installalo tramite Sideloadly o AltStore.
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
